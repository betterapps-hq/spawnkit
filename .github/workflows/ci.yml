name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CF_SEND_TELEMETRY: "false"
  DO_NOT_TRACK: "1"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm verify
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:telemetry-package
      - run: pnpm test:cli-package

  browser:
    name: Browser acceptance (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    concurrency:
      group: browser-${{ matrix.project }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec turbo run build --filter=@spawnkit/cli --filter=@spawn/stories
      - run: pnpm test:e2e --project=${{ matrix.project }} --workers=2 --reporter=line,html
        env:
          SPAWN_E2E_STATIC_STORIES: "1"
      - run: pnpm exec playwright test --config playwright.community.config.ts --project=${{ matrix.project }} --workers=2 --reporter=line,html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failures-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Each kit, the flows and a sample of the pairwise set of answers, generated, installed, tested and built.
  # template-matrix.yml runs the whole pairwise set nightly.
  templates:
    name: Templates (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    concurrency:
      group: templates-${{ matrix.shard }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:templates --shard ${{ matrix.shard }}/2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: template-failures-${{ matrix.shard }}
          path: |
            work/templates-*/*.log
            work/templates-*/*.png
            work/templates-*/results.json
          retention-days: 7

  staging:
    name: Staging
    needs: [verify, browser, templates]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pull-requests: read
      deployments: write
    uses: ./.github/workflows/release.yml
    with:
      environment: staging
      ref: ${{ github.sha }}
    secrets: inherit

  preview:
    name: PR preview
    needs: [verify, browser, templates]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
      deployments: write
    uses: ./.github/workflows/release.yml
    with:
      environment: preview
      ref: ${{ github.sha }}
      pr: ${{ github.event.pull_request.number }}
      head-sha: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
