name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CF_SEND_TELEMETRY: "false"
  DO_NOT_TRACK: "1"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm verify
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:templates
      - run: pnpm test:telemetry-package

  browser:
    name: Browser acceptance (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    concurrency:
      group: browser-${{ matrix.project }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec turbo run build --filter=@spawn/cli --filter=@spawn/stories
      - run: pnpm test:e2e --project=${{ matrix.project }} --workers=2 --reporter=line,html
        env:
          SPAWN_E2E_STATIC_STORIES: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failures-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  staging:
    name: Staging
    needs: [verify, browser]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pull-requests: read
      deployments: write
    uses: ./.github/workflows/release.yml
    with:
      environment: staging
      ref: ${{ github.sha }}
    secrets: inherit

  preview:
    name: PR preview
    needs: [verify, browser]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
      deployments: write
    uses: ./.github/workflows/release.yml
    with:
      environment: preview
      ref: ${{ github.sha }}
      pr: ${{ github.event.pull_request.number }}
      head-sha: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
