name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The jobs here read these. A called workflow doesn't, so verify passes them again as its env.
env:
  CF_SEND_TELEMETRY: "false"
  DO_NOT_TRACK: "1"

jobs:
  # The shared pipelines' ci-verify checks out, installs Node from .nvmrc, pnpm and the locked dependencies, then runs
  # prepare and command. A newer push to the same branch or pull request cancels it.
  verify:
    name: Verify
    uses: betterapps-hq/pipelines/.github/workflows/ci-verify.yml@c3b85f070cf22fbf7a4dae841461f82e2b16ea20 # v1.2.0
    with:
      os: '["ubuntu-24.04"]'
      timeout-minutes: 30
      # Every step gets these, the install included.
      env: |
        CF_SEND_TELEMETRY=false
        DO_NOT_TRACK=1
      # Tests write under work/, and the media processor's need FFmpeg.
      prepare: |
        mkdir -p work
        sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      command: |
        pnpm verify
        pnpm exec playwright install --with-deps chromium
        pnpm test:telemetry-package
        pnpm test:cli-package

  browser:
    name: Browser acceptance (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    concurrency:
      group: browser-${{ matrix.project }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: betterapps-hq/pipelines/github/actions/setup@efa1c3e00652cca72174fdf3abdb911a5c501c45 # v1.11.1
      - run: mkdir -p work
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec turbo run build --filter=@spawnkit/cli --filter=@spawn/stories
      - run: pnpm test:e2e --project=${{ matrix.project }} --workers=2 --reporter=line,html
        env:
          SPAWN_E2E_STATIC_STORIES: "1"
      - run: pnpm exec playwright test --config playwright.community.config.ts --project=${{ matrix.project }} --workers=2 --reporter=line,html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failures-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Each kit, the flows and a sample of the pairwise set of answers, generated, installed, tested and built.
  # template-matrix.yml runs the whole pairwise set weekly.
  templates:
    name: Templates (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    concurrency:
      group: templates-${{ matrix.shard }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: betterapps-hq/pipelines/github/actions/setup@efa1c3e00652cca72174fdf3abdb911a5c501c45 # v1.11.1
      - run: mkdir -p work
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:templates --shard ${{ matrix.shard }}/2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: template-failures-${{ matrix.shard }}
          path: |
            work/templates-*/*.log
            work/templates-*/*.png
            work/templates-*/results.json
          retention-days: 7

  staging:
    name: Staging
    needs: [verify, browser, templates]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pull-requests: read
      deployments: write
    uses: ./.github/workflows/release.yml
    with:
      environment: staging
      ref: ${{ github.sha }}
    secrets: inherit

  preview:
    name: PR preview
    needs: [verify, browser, templates]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
      deployments: write
    uses: ./.github/workflows/release.yml
    with:
      environment: preview
      ref: ${{ github.sha }}
      pr: ${{ github.event.pull_request.number }}
      head-sha: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
