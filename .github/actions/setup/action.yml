name: Install workspace
description: Install the pinned Node and pnpm versions and frozen dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
    - uses: pnpm/action-setup@v4
    - run: |
        mkdir -p work
        pnpm install --frozen-lockfile
      shell: bash
