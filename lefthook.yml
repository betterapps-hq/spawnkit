pre-commit:
  commands:
    lint:
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm exec oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    format:
      glob: "*.{js,jsx,ts,tsx,json,css,yaml,yml,md}"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
pre-push:
  commands:
    types:
      run: pnpm check:types
